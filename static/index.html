<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Football Analyzer">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">
<link rel="icon" type="image/png" href="/static/icons/icon-192.png">
<link rel="stylesheet" href="/static/styles.css">
<title>Football Analyzer · Mobile</title>
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <div class="brand"><div class="mark">FA<span class="mark-pip"></span></div><div class="brand-words"><b>FOOTBALL<span> ANALYZER</span></b><small>MOBILE · ESPN DATA</small></div></div>
    <button class="icon-btn" id="refreshBtn" aria-label="Actualizează datele" title="Actualizează datele"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14-5L4 8m0-5v5h5M4 13a8 8 0 0 0 14 5l2-2m0 5v-5h-5"/></svg></button>
  </header>
  <main id="main"><div class="empty"><div class="loader"></div><p>Pregătesc meciurile...</p></div></main>
  <nav class="bottom-nav" aria-label="Navigare">
    <button data-view="home" class="nav-item active"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10H3V10Zm6 10v-7h6v7"/></svg><span>Meciuri</span></button>
    <button data-view="search" class="nav-item"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg><span>Caută</span></button>
    <button data-view="history" class="nav-item"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6M3 4v5h5M12 7v5l4 2"/></svg><span>Istoric</span></button>
  </nav>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="overlay hidden" id="authOverlay" role="dialog" aria-modal="true" aria-labelledby="authHeading">
  <div class="auth-card"><div class="auth-logo">FA</div><h2 id="authHeading">Acces la Football Analyzer</h2><p>Introdu codul de acces configurat pentru serverul tău.</p><form id="authForm"><input id="tokenInput" type="password" autocomplete="current-password" placeholder="Cod de acces" required><button type="submit" class="primary-btn">Intră în aplicație</button></form><small>Codul se păstrează numai în acest browser. Nu îl trimite altor persoane.</small></div>
</div>
<script src="/static/app.js" defer></script>
</body></html>
